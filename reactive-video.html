<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Temporal Region Reactive</title>
<style>
  :root { --bg:#0f0f0f; --panel:#1a1a1a; --text:#e8e8e8; --muted:#888; --accent:#e85d04; --border:#2a2a2a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; display:flex; height:100vh; overflow:hidden; }
  body.fullscreen #sidebar { display:none; }
  body.fullscreen #stage { position:fixed; inset:0; background:#000; z-index:9999; }
  #sidebar { width:320px; background:var(--panel); border-right:1px solid var(--border); padding:18px; overflow-y:auto; flex-shrink:0; }
  h1 { margin:0 0 4px 0; font-size:16px; }
  .sub { font-size:12px; color:var(--muted); margin-bottom:16px; }
  .section { margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid var(--border); }
  .section h2 { margin:0 0 8px 0; font-size:12px; text-transform:uppercase; color:var(--muted); }
  label { display:flex; justify-content:space-between; margin:8px 0 3px 0; font-size:13px; }
  input[type="range"] { width:100%; accent-color:var(--accent); }
  .value { font-variant-numeric:tabular-nums; color:var(--muted); font-size:12px; }
  button { width:100%; margin-top:6px; padding:8px; background:#252525; color:white; border:1px solid #333; border-radius:5px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); }
  input[type="file"] { font-size:12px; margin-top:4px; }
  #stage { flex:1; display:flex; align-items:center; justify-content:center; background:#000; position:relative; overflow:hidden; }
  video { max-width:100%; max-height:100%; object-fit:contain; }
  .hint { font-size:11px; color:var(--muted); margin-top:8px; line-height:1.4; }
  #exit-fs { display:none; position:absolute; top:12px; right:12px; z-index:10000; width:auto; padding:8px 14px; background:rgba(0,0,0,0.6); border:1px solid #444; }
  .status { font-size:12px; color:var(--accent); margin-top:6px; }
</style>
</head>
<body>
<div id="sidebar">
  <h1>Temporal Regions</h1>
  <div class="sub">Jump through the clip on bass / mid / treble</div>
  <div class="section">
    <h2>Media</h2>
    <label>Load video clip</label>
    <input type="file" id="media-file" accept="video/*">
    <button id="play-btn" onclick="togglePlayback()" disabled>Play</button>
    <button onclick="toggleFullscreen()">Fullscreen</button>
    <div class="status" id="status">Ambient</div>
  </div>
  <div class="section">
    <h2>Triggers</h2>
    <label>Bass Threshold <span class="value" id="v-bass">0.4</span></label>
    <input type="range" id="bass-th" min="0.1" max="0.8" step="0.01" value="0.4">
    <label>Mid Threshold <span class="value" id="v-mid">0.35</span></label>
    <input type="range" id="mid-th" min="0.1" max="0.8" step="0.01" value="0.35">
    <label>Treble Threshold <span class="value" id="v-treble">0.3</span></label>
    <input type="range" id="treble-th" min="0.1" max="0.8" step="0.01" value="0.3">
    <label>Sensitivity <span class="value" id="v-sens">1.0</span></label>
    <input type="range" id="sens" min="0.3" max="2" step="0.05" value="1.0">
    <label>Hold Time (s) <span class="value" id="v-hold">0.6</span></label>
    <input type="range" id="hold" min="0.15" max="1.5" step="0.05" value="0.35">
  </div>
  <div class="hint">Ambient loops the start.<br>Mid jumps to the middle.<br>Bass jumps to the end.<br>Returns to ambient after hold time.</div>
</div>
<div id="stage">
  <button id="exit-fs" onclick="toggleFullscreen()">Exit</button>
  <video id="vid" loop muted playsinline></video>
  <audio id="aud" loop></audio>
</div>
<script>
const video = document.getElementById('vid');
let audioContext, analyser, dataArray, source, mediaElement;
let isPlaying = false;
let bass = 0, mid = 0, treble = 0;
let currentMode = 'ambient';
let holdUntil = 0;
const controls = {
  bassTh: document.getElementById('bass-th'),
  midTh: document.getElementById('mid-th'),
  trebleTh: document.getElementById('treble-th'),
  sens: document.getElementById('sens'),
  hold: document.getElementById('hold')
};
function updateLabels() {
  document.getElementById('v-bass').textContent = parseFloat(controls.bassTh.value).toFixed(2);
  document.getElementById('v-mid').textContent = parseFloat(controls.midTh.value).toFixed(2);
  document.getElementById('v-treble').textContent = parseFloat(controls.trebleTh.value).toFixed(2);
  document.getElementById('v-sens').textContent = parseFloat(controls.sens.value).toFixed(2);
  document.getElementById('v-hold').textContent = parseFloat(controls.hold.value).toFixed(1);
}
function setupAudio() {
  if (!audioContext) {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 256;
    dataArray = new Uint8Array(analyser.frequencyBinCount);
  }
}
document.getElementById('media-file').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  setupAudio();
  if (mediaElement) mediaElement.pause();
  const url = URL.createObjectURL(file);
  video.src = url;
  video.muted = true;
  const audio = document.getElementById('aud');
  audio.src = url;
  audio.loop = true;
  mediaElement = audio;
  mediaElement.crossOrigin = 'anonymous';
  try {
    source = audioContext.createMediaElementSource(mediaElement);
    source.connect(analyser);
    analyser.connect(audioContext.destination);
  } catch (err) {}
  document.getElementById('play-btn').disabled = false;
});
function togglePlayback() {
  if (!mediaElement) return;
  if (isPlaying) {
    mediaElement.pause();
    isPlaying = false;
    document.getElementById('play-btn').textContent = 'Play';
  } else {
    audioContext.resume();
    mediaElement.play().then(() => {
      isPlaying = true;
      document.getElementById('play-btn').textContent = 'Pause';
      requestAnimationFrame(loop);
    });
  }
}
function updateAudio() {
  if (!analyser) return;
  analyser.getByteFrequencyData(dataArray);
  const len = dataArray.length;
  let b=0, m=0, t=0;
  for (let i=0; i<len*0.15; i++) b += dataArray[i];
  for (let i=Math.floor(len*0.15); i<len*0.5; i++) m += dataArray[i];
  for (let i=Math.floor(len*0.5); i<len; i++) t += dataArray[i];
  bass = (b / (len*0.15*255)) || 0;
  mid = (m / (len*0.35*255)) || 0;
  treble = (t / (len*0.5*255)) || 0;
}
function setRegion(mode) {
  if (!video.duration) return;
  const d = video.duration;
  if (mode === 'ambient') {
    video.currentTime = 0;
  } else if (mode === 'mid') {
    video.currentTime = d * 0.33;
  } else if (mode === 'bass') {
    video.currentTime = d * 0.66;
  }
  if (video.paused) video.play().catch(() => {});
  currentMode = mode;
  document.getElementById('status').textContent = mode.charAt(0).toUpperCase() + mode.slice(1);
}
function loop() {
  if (!isPlaying) return;
  updateAudio();
  const sens = +controls.sens.value;
  const b = bass * sens;
  const m = mid * sens;
  const t = treble * sens;
  const now = performance.now() / 1000;
  const hold = +controls.hold.value;
  let next = currentMode;
  if (b > +controls.bassTh.value) next = 'bass';
  else if (m > +controls.midTh.value) next = 'mid';
  else if (t > +controls.trebleTh.value) next = 'treble';
  else if (now > holdUntil) next = 'ambient';
  if (next !== currentMode) {
    setRegion(next);
    if (next !== 'ambient') holdUntil = now + hold;
  }
  // Keep the active region playing forward
  if (video.paused) video.play().catch(() => {});
  if (currentMode === 'ambient' && video.currentTime > video.duration * 0.22) {
    video.currentTime = 0;
  }
  updateLabels();
  requestAnimationFrame(loop);
}
let exitTimeout = null;
function showExitTemporarily() {
  const exitBtn = document.getElementById('exit-fs');
  if (!exitBtn || !document.body.classList.contains('fullscreen')) return;
  exitBtn.style.display = 'block';
  clearTimeout(exitTimeout);
  exitTimeout = setTimeout(() => { exitBtn.style.display = 'none'; }, 2500);
}
function toggleFullscreen() {
  const isFs = document.body.classList.toggle('fullscreen');
  const exitBtn = document.getElementById('exit-fs');
  if (isFs) {
    document.documentElement.requestFullscreen?.().catch(() => {});
    if (exitBtn) exitBtn.style.display = 'none';
  } else {
    document.exitFullscreen?.().catch(() => {});
    if (exitBtn) exitBtn.style.display = 'none';
  }
}
document.getElementById('stage').addEventListener('click', showExitTemporarily);
document.getElementById('stage').addEventListener('touchstart', showExitTemporarily, {passive: true});
Object.values(controls).forEach(el => el.addEventListener('input', updateLabels));
updateLabels();
</script>
</body>
</html>
